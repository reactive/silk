name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --immutable

      # silk-core package exports resolve types/JS from dist/; Linaria also
      # requires core dist before the web package builds.
      - name: Build
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Packed consumer check
        run: yarn test:packed

      - name: Performance budgets
        run: yarn test:perf

      # Validates CSF/MDX, source alias, docgen, and Linaria extraction.
      # On main, docs.yml already builds and deploys the same output.
      - name: Build Storybook
        if: github.event_name == 'pull_request'
        run: yarn docs:build
